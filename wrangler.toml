# Cloudflare Wrangler 配置文件
# @see https://developers.cloudflare.com/workers/wrangler/configuration/

name = "api-check"
main = "src/index.js"
compatibility_date = "2026-01-01"

[assets]
directory = "./frontend/dist"

# D1：用户账号 + Key 保险箱
[[d1_databases]]
binding = "DB"
database_name = "keynest"
database_id = "0c384ee9-6057-4a72-8a14-12fcccd20af6"

# Durable Objects：区域出口
[[durable_objects.bindings]]
name = "REGIONAL_FETCHER"
class_name = "RegionalFetcher"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RegionalFetcher"]

[vars]
ALLOWED_ORIGINS = "[\"https://*.workers.dev\",\"https://*.vercel.app\",\"https://keynest.tanxy.club\"]"
ENABLE_UA_RANDOMIZATION = "true"
ENABLE_ACCEPT_LANGUAGE_RANDOMIZATION = "true"
# 注册邀请码（固定码，可按需修改后重新部署）
INVITE_CODE = "KeyNest2026"
# 会话签名密钥（生产环境建议用 wrangler secret put JWT_SECRET 覆盖）
JWT_SECRET = "keynest-change-me-jwt-secret-7f3a9c2e1b8d4f6a"
